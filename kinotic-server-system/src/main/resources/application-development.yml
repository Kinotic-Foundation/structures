# YAML Reference http://www.yaml.org/refcard.html
# A developer's machine; application-single-machine.yml holds what it shares with the demonstration profile.
kinotic:
  debug: true
  managementApi:
    # Placeholders the GitHub App the import below writes replaces. An import outranks only the file that declares
    # it, and application-single-machine.yml outranks this file, so the placeholders live here
    github:
      webhookSecret: "-"
      appPrivateKey: "-"
  traceLog:
    excludes:
      - "srv://system-api~org.kinotic.system.api.services.workload.VmNodeOrchestrationService/heartbeat"
      - "srv://system-api~org.kinotic.system.api.services.workload.VmNodeOrchestrationService/reportWorkloadStatus"
  domain:
    # Invites the member service this server hosts sends are accepted in the portal
    portalBaseUrl: http://localhost:5173
    elastic-connections:
      - scheme: "http"
        host: "localhost"
        port: "9200"
  ignite:
    discoveryType: SHAREDFS

logging:
  level:
    org:
      kinotic: TRACE
      # Logs every classpath resource it scans at TRACE, which drowns the rest of the log
      kinotic.core.internal.utils.ClassPathScanningMetadataReaderProvider: DEBUG

spring:
  config:
    # The developer's GitHub App, written by dev-tools/github-app/dev-github-app.ts create, with
    # which this server mints the tokens deployments fetch their repositories with. The compose
    # system server loads the same file as ./config/application.yml (compose.kinotic-servers.yml).
    import: optional:file:${user.home}/.kinotic/dev-environment/kinotic-server-system/application.yml
