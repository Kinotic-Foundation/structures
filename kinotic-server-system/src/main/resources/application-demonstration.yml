# The demonstration server: the whole platform on one machine from deployment/docker-compose
# (compose.yml), to try Kinotic with no Azure and no mail service. compose.kinotic-servers.yml runs
# every server with this profile, and supplies the container addresses: Elasticsearch, the Ignite
# cluster and the observability stack. application-single-machine.yml holds what it shares with the
# development profile.
kinotic:
  domain:
    # The portal the management server serves on 9090, where invitations are accepted
    portalBaseUrl: http://localhost:9090
    email:
      # No mail service: an inviter is shown the invitation's link to send on
      enabled: false
      showLinksInUI: true
