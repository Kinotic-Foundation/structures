# The development server: one all-in-one kinotic-server on a docker-compose stack of its own
# (deployment/docker-compose/compose.dev-server.yml), with Front Door, the sites storage
# account, email, and a Key Vault in Azure (deployment/terraform/azure/dev-server).
# Activated as `production,compose,dev-server`. Holds what is fixed for this shape of
# deployment; everything that differs per server — hostnames, endpoints, credentials —
# arrives through the environment (see dev-server.env.example beside the compose files).
kinotic:
  persistence:
    # Three master-eligible data nodes, one physical disk each: one replica survives a disk,
    # and one shard per index keeps a published EntityDefinition cheap against the
    # 1000-shard-per-node ceiling. The production defaults (3 and 2) assume a larger cluster.
    numberOfShards: 1
    numberOfReplicas: 1
  apiGateway:
    ssl:
      # certbot's certificate for the server's hostname, mounted by the compose override;
      # Vert.x terminates TLS on both ports and there is no reverse proxy
      enabled: true
      certPath: /etc/kinotic/certs/fullchain.pem
      keyPath: /etc/kinotic/certs/privkey.pem
    cors:
      # The portal on the server's own hostname (on either port) and the UIs published under
      # the sites domain
      allowedOriginPattern: "https:\\/\\/${DEV_SERVER_HOSTNAME}(:\\d+)?|https:\\/\\/[a-z0-9-]+\\.${KINOTIC_SYSTEMAPI_UIDEPLOYMENT_SITESDOMAIN}"
      allowCredentials: true
  platformSecrets:
    # Generated once when the server is built (generate-secrets.sh in deployment/terraform/proxmox),
    # in the shape deployment/kind/terraform/platform-secrets.tf produces: an activeKeyId and a
    # keys list, so a key can be added to the set at migration time
    jwtSigningKeysPath: /etc/kinotic/platform-secrets/jwt-signing-keys
  domain:
    secretStorage:
      # The in-memory default loses every stored secret on restart; the Key Vault the
      # dev-server terraform root creates keeps them, and keeps them in Azure for migration.
      # The master key SecretNameDeriver derives storage names with arrives as
      # KINOTIC_DOMAIN_SECRETSTORAGE_MASTERKEY from the secrets env file.
      backend: AZURE
  systemApi:
    uiDeployment:
      disableProvisioner: false
    deployment:
      serverPort: 58503
      serverUseSsl: true
      # Destinations beyond the gateway a sync workload may reach, as CIDRs: a CLOUD_HYPERVISOR
      # node's egress rules match addresses, so the hostnames the BOXLITE development profile
      # uses are rejected here. GitHub's ranges from https://api.github.com/meta (git and web);
      # the npm registry sits behind Cloudflare. Widen when a fetch is refused, never to 0.0.0.0/0.
      syncAllowedHosts:
        - 140.82.112.0/20
        - 143.55.64.0/20
        - 185.199.108.0/22
        - 192.30.252.0/22
        - 104.16.0.0/12
