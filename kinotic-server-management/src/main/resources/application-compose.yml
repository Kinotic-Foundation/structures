# Profile activated alongside `development` when running inside docker-compose
# (SPRING_PROFILES_ACTIVE=development,compose). Holds overrides that diverge from
# IDE-based dev.
# The portal build the server serves on 9090, and the API behind it. A developer's tunnel replaces
# both from ./config/application.yml, which compose.kinotic-servers.yml mounts and which outranks
# every file packaged in the jar.
kinotic:
  domain:
    portalBaseUrl: http://localhost:9090
  managementApi:
    apiBaseUrl: http://localhost:9090
