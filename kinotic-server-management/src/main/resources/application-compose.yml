# The e2e stack's profile for a server inside docker-compose
# (SPRING_PROFILES_ACTIVE=test,e2e-tests,compose in compose.kinotic-e2e-test.yml): the portal build the
# server serves on 9090, and the API behind it.
kinotic:
  domain:
    portalBaseUrl: http://localhost:9090
  managementApi:
    apiBaseUrl: http://localhost:9090
