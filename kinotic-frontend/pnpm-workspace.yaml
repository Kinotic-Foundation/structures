packages:
  - 'apps/*'
  - 'packages/*'

# Every @kinotic-ai package is pinned once here and referenced as `catalog:` by the
# workspace packages. management-api augments core's Kinotic singleton, so two versions
# of it in one graph give the apps different `Kinotic.*` service types.
catalog:
  '@kinotic-ai/core': ^5.0.0-beta.26
  '@kinotic-ai/idl': ^5.0.0-beta.1
  '@kinotic-ai/management-api': ^5.0.0-beta.60
  '@kinotic-ai/persistence': ^5.0.0-beta.10
  '@kinotic-ai/system-api': ^5.0.0-beta.26

# Branch-only: resolves the first-party packages to their sources in kinotic-js/workspace, which
# Gradle builds before the frontend, so this branch needs no npm publish. Never merge into develop.
overrides:
  '@kinotic-ai/core': link:../kinotic-js/workspace/packages/core
  '@kinotic-ai/idl': link:../kinotic-js/workspace/packages/idl
  '@kinotic-ai/management-api': link:../kinotic-js/workspace/packages/management-api
  '@kinotic-ai/persistence': link:../kinotic-js/workspace/packages/persistence
  '@kinotic-ai/system-api': link:../kinotic-js/workspace/packages/system-api

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  es5-ext: false
  vue-demi: false

minimumReleaseAge: 1440 # minutes; third-party releases younger than 24h are rejected

# First-party packages are trusted at any version, so a freshly-published release
# doesn't block the build.
minimumReleaseAgeExclude:
  - '@kinotic-ai/core'
  - '@kinotic-ai/idl'
  - '@kinotic-ai/management-api'
  - '@kinotic-ai/persistence'
  - '@kinotic-ai/system-api'
