# Three Elasticsearch nodes for the development server, one per passthrough disk mounted on
# the platform VM at /mnt/es-1, /mnt/es-2 and /mnt/es-3 (deployment/terraform/proxmox). The
# first keeps the service name compose.kinotic-migration.yml and compose.kinotic-server.yml
# depend on, so neither needs an override to find the cluster.
#
# Security is on. Three nodes with security on require transport TLS, so es-setup issues a
# CA and one certificate per node into a shared volume before the nodes start; HTTP stays
# plain because only containers on this compose network reach it, and no port is published.
x-es-node: &es-node
  image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
  depends_on:
    es-setup:
      condition: service_healthy
  ulimits:
    memlock:
      soft: -1
      hard: -1
  healthcheck:
    test: ["CMD-SHELL", "curl --silent --fail -u \"elastic:$${ELASTIC_PASSWORD}\" http://127.0.0.1:9200/_cluster/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 150s
  deploy:
    resources:
      reservations:
        memory: 4G
      limits:
        memory: 4G

x-es-env: &es-env
  cluster.name: kinotic
  cluster.initial_master_nodes: es-1,es-2,es-3
  discovery.seed_hosts: kinotic-elasticsearch,kinotic-elasticsearch-2,kinotic-elasticsearch-3
  node.roles: master,data,ingest,transform
  bootstrap.memory_lock: "true"
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
  xpack.security.enabled: "true"
  xpack.security.http.ssl.enabled: "false"
  xpack.security.transport.ssl.enabled: "true"
  xpack.security.transport.ssl.verification_mode: certificate
  xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
  ES_JAVA_OPTS: -Xms2g -Xmx2g

services:
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: kinotic-es-setup
    user: "0"
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs
    command: >
      bash -c '
        set -e;
        cd /usr/share/elasticsearch;
        if [ ! -f config/certs/ca.zip ]; then
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip -q config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          printf "instances:\n" > config/certs/instances.yml;
          for n in 1 2 3; do
            h=kinotic-elasticsearch; [ $$n = 1 ] || h=kinotic-elasticsearch-$$n;
            printf "  - name: es-%s\n    dns:\n      - %s\n      - localhost\n    ip:\n      - 127.0.0.1\n" $$n $$h >> config/certs/instances.yml;
          done;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip -q config/certs/certs.zip -d config/certs;
        fi;
        chown -R 1000:0 config/certs;
        find config/certs -type d -exec chmod 750 {} \;;
        find config/certs -type f -exec chmod 640 {} \;;
        echo "certificates ready";
        sleep infinity
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/share/elasticsearch/config/certs/es-3/es-3.crt ]"]
      interval: 2s
      timeout: 5s
      retries: 60

  kinotic-elasticsearch:
    <<: *es-node
    container_name: kinotic-elasticsearch
    environment:
      <<: *es-env
      node.name: es-1
      xpack.security.transport.ssl.key: certs/es-1/es-1.key
      xpack.security.transport.ssl.certificate: certs/es-1/es-1.crt
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs
      - /mnt/es-1:/usr/share/elasticsearch/data

  kinotic-elasticsearch-2:
    <<: *es-node
    container_name: kinotic-elasticsearch-2
    environment:
      <<: *es-env
      node.name: es-2
      xpack.security.transport.ssl.key: certs/es-2/es-2.key
      xpack.security.transport.ssl.certificate: certs/es-2/es-2.crt
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs
      - /mnt/es-2:/usr/share/elasticsearch/data

  kinotic-elasticsearch-3:
    <<: *es-node
    container_name: kinotic-elasticsearch-3
    environment:
      <<: *es-env
      node.name: es-3
      xpack.security.transport.ssl.key: certs/es-3/es-3.key
      xpack.security.transport.ssl.certificate: certs/es-3/es-3.crt
    volumes:
      - es-certs:/usr/share/elasticsearch/config/certs
      - /mnt/es-3:/usr/share/elasticsearch/data

volumes:
  es-certs:
