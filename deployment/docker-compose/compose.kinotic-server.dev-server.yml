# Development server overrides for kinotic-server. Everything specific to the deployment
# comes from two env files on the platform VM: /etc/kinotic/dev-server.env, written by
# terraform from the Azure outputs, and /etc/kinotic/secrets.env, placed by the operator and
# never passing through terraform state. The dev-server Spring profile holds what is fixed for
# this shape of deployment (application-dev-server.yml).
services:
  kinotic-server:
    # The LAN, not the loopback: peers arrive through the router's port forwards and the
    # node VM reaches the gateway across the bridge
    ports: !override
      - "9090:9090"
      - "58503:58503"
    env_file:
      - /etc/kinotic/dev-server.env
      - /etc/kinotic/secrets.env
    environment:
      SPRING_PROFILES_ACTIVE: production,compose,dev-server
      KINOTIC_DOMAIN_APPBASEURL: https://${DEV_SERVER_HOSTNAME:?DEV_SERVER_HOSTNAME is required}
      KINOTIC_DOMAIN_APIBASEURL: https://${DEV_SERVER_HOSTNAME}:58503
      KINOTIC_DOMAIN_EMAIL_ENABLED: "true"
      KINOTIC_DOMAIN_ELASTICUSERNAME: elastic
      KINOTIC_DOMAIN_ELASTICPASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_1_SCHEME: http
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_1_HOST: kinotic-elasticsearch-2
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_1_PORT: 9200
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_2_SCHEME: http
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_2_HOST: kinotic-elasticsearch-3
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_2_PORT: 9200
    volumes:
      # certbot's certificate for the hostname, and the JWT signing key set
      - /etc/kinotic/certs:/etc/kinotic/certs:ro
      - /etc/kinotic/platform-secrets:/etc/kinotic/platform-secrets:ro
    depends_on:
      kinotic-elasticsearch-2:
        condition: service_healthy
      kinotic-elasticsearch-3:
        condition: service_healthy
