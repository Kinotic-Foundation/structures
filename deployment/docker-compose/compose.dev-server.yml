# The development server's stack, run by kinotic-dev-server.service on the platform VM
# (deployment/terraform/proxmox): three Elasticsearch nodes on their own disks, the
# observability stack, the one-shot migration, and the server. Every piece is the file local
# development runs plus a dev-server override, so the two stacks share one definition of each
# service.
#
#   docker compose --env-file /etc/kinotic/dev-server.env --env-file /etc/kinotic/secrets.env \
#                  -f compose.dev-server.yml up -d
include:
  - compose.elasticsearch-dev-server.yml
  - path:
      - compose-otel.yml
      - compose-otel.dev-server.yml
  - path:
      - compose.kinotic-migration.yml
      - compose.kinotic-migration.dev-server.yml
  - path:
      - compose.kinotic-server.yml
      - compose.kinotic-server.dev-server.yml
